<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steadfast</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Steadfast">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{
  color-scheme:light;
  --text:#14161c;--muted:#565c6c;--card:rgba(255,255,255,.68);--card2:rgba(255,255,255,.88);
  --line:rgba(20,24,40,.10);--field:rgba(255,255,255,.78);--shadow:0 10px 30px rgba(30,40,80,.10);
  --accent:#2563eb;--on-accent:#fff;--bg0:#eaf3ff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--text:#f2f3f7;--muted:#aab0bf;--card:rgba(16,18,28,.58);--card2:rgba(24,26,38,.9);--line:rgba(255,255,255,.12);--field:rgba(255,255,255,.08);--shadow:0 10px 30px rgba(0,0,0,.35)}
}
:root[data-theme="dark"]{color-scheme:dark;--text:#f2f3f7;--muted:#aab0bf;--card:rgba(16,18,28,.58);--card2:rgba(24,26,38,.9);--line:rgba(255,255,255,.12);--field:rgba(255,255,255,.08);--shadow:0 10px 30px rgba(0,0,0,.35)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg0);color:var(--text);font:16px/1.5 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wall{position:fixed;inset:0;z-index:0;pointer-events:none}
.wall svg{width:100%;height:100%;display:block}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 16px 124px}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;margin:0}
.display{font-size:clamp(42px,12.5vw,58px);line-height:.96;font-weight:800;letter-spacing:-.03em}
.display.sm{font-size:30px;letter-spacing:-.02em}
h2{font-size:21px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px}
h3{font-size:16px;font-weight:700;margin:18px 0 8px}
h3:first-child{margin-top:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13.5px}.warn{color:#c2410c}
.kicker{color:var(--muted);font-weight:600;font-size:15px;margin-bottom:8px}
.anchor{color:var(--muted);margin-top:10px;font-weight:600}
.pagehead{padding:12px 4px 6px}
.card{background:var(--card);-webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);border:1px solid var(--line);border-radius:26px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card.accent{background:color-mix(in srgb,var(--accent) 88%,transparent);color:var(--on-accent);border-color:transparent}
.card.accent .muted{color:inherit;opacity:.82}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.cardhead h2{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:is(button,a,input,textarea,select,summary):focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:999px;padding:14px 18px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:16px;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--field);color:var(--text);border:1px solid var(--line)}
.btn.big{padding:18px;font-size:17px;margin:20px 0 8px}
.btn.small{width:auto;padding:9px 18px;font-size:15px}
.btn[disabled]{opacity:.55}
.link{background:none;border:0;color:var(--accent);font-weight:700;padding:10px 0 0;display:block;margin:0 auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--field);display:grid;place-items:center;flex:none}
.iconbtn.sm{width:34px;height:34px}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid color-mix(in srgb,var(--text) 24%,transparent);display:grid;place-items:center;flex:none;color:transparent;transition:background .15s,border-color .15s}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:pop .28s ease}
@keyframes pop{50%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Home */
.appbar{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 0}
.mark{width:36px;height:36px;display:block;border-radius:9px;overflow:hidden;box-shadow:0 4px 14px rgba(255,46,138,.28)}
.mark svg{display:block}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 13px;border-radius:999px;background:var(--card2);border:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.qlab{display:block;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:4px}
.setacts{display:flex;gap:8px;margin-top:12px}
.setacts button{flex:1;padding:10px 0;border-radius:999px;border:1px dashed color-mix(in srgb,var(--text) 28%,transparent);background:none;font-weight:700;font-size:14.5px}
.uphint{color:#15803d;font-weight:700}
:root[data-theme="dark"] .uphint{color:#4ade80}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .uphint{color:#4ade80}}
.hero{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;padding:10px 4px 4px}
.hello{font-weight:600;color:var(--muted)}
.hero .display{margin-top:12px}
.hero .anchor{margin-top:8px}
.ringbox{text-align:center}
.ring .rn{font:800 27px 'Bricolage Grotesque',sans-serif;fill:var(--text)}
.ring .rl{font:600 12px 'DM Sans',sans-serif;fill:var(--muted)}
.streak{font-size:13px;color:var(--muted);font-weight:700;margin-top:2px}
.trow{display:flex;align-items:center;gap:14px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.trow:last-child{border-bottom:0}
.tico{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);flex:none}
.grow{flex:1;min-width:0}
.trow b{display:block;font-weight:700;line-height:1.3}
.trow small{display:block;color:var(--muted);font-size:14px;line-height:1.35}
.lockline{display:flex;align-items:center;gap:10px}
.lockline h2{margin:0}
.unlock{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 14px;border-radius:999px;background:color-mix(in srgb,currentColor 12%,transparent);font-weight:600;font-size:14.5px}
.unlock.on{background:#16a34a;color:#fff}
.peek{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.peek p{padding:10px 12px;border-radius:14px;background:color-mix(in srgb,currentColor 10%,transparent);font-size:15px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;text-align:center}
.wd{padding:8px 0 10px;border-radius:16px}
.wd.today{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.wd.future{opacity:.4}
.wd b{display:block;font-size:13px;color:var(--muted);font-weight:700}
.wd i{display:block;width:12px;height:12px;border-radius:50%;margin:7px auto 0;border:2px solid color-mix(in srgb,var(--text) 22%,transparent)}
.wd i.on{background:var(--accent);border-color:var(--accent)}
.wd i.sq{border-radius:4px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin-top:8px;justify-content:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--accent);display:inline-block}
.legend i.sq{border-radius:3px}
.settingsbtn{display:flex;align-items:center;justify-content:center;gap:10px;margin:22px auto 4px;padding:12px 22px;border-radius:999px;border:1px solid var(--line);background:var(--card);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);font-weight:700}

/* Water */
.wnum{font:800 30px 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em}
.wnum small{font:600 15px 'DM Sans',sans-serif;color:var(--muted)}
input[type=range].water{-webkit-appearance:none;appearance:none;width:100%;height:46px;margin:12px 0 4px;border-radius:999px;border:1px solid var(--line);background:linear-gradient(90deg,var(--accent) 0 var(--p,0%),var(--field) var(--p,0%))}
input[type=range].water::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.25)}
input[type=range].water::-moz-range-thumb{width:40px;height:40px;border-radius:50%;background:#fff;border:3px solid var(--accent)}
.quick{display:flex;gap:8px;margin-top:8px}
.quick button{flex:1;padding:10px 0;border-radius:999px;border:1px solid var(--line);background:var(--field);font-weight:700;font-size:15px}

/* Quiet time */
.passages{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.passage{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;background:var(--field);border:1px solid var(--line);text-decoration:none;font-weight:700}
.passage svg{color:var(--accent)}
.timer{text-align:center;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.clock{font:800 64px/1 'Bricolage Grotesque',sans-serif;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--field);border:1px solid var(--line);overflow:hidden;margin:14px 0 16px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .6s}
.qs{list-style:none;counter-reset:q;padding:0;margin:10px 0 0}
.qs li{counter-increment:q;padding:14px 0;border-bottom:1px solid var(--line)}
.qs li:last-child{border-bottom:0;padding-bottom:0}
.qs li p{display:flex;gap:10px;font-weight:600;line-height:1.45}
.qs li p::before{content:counter(q);flex:none;width:26px;height:26px;border-radius:50%;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);display:grid;place-items:center;font-size:14px;font-weight:800}
textarea,input[type=text],input[type=number],input[type=time],select{font:inherit;font-size:16px;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%}
.qs textarea{margin-top:10px;resize:vertical;min-height:58px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{text-align:left;padding:13px 15px;border-radius:16px;border:1px solid var(--line);background:var(--field);font-weight:600;line-height:1.4}
.opt.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 15%,var(--field));box-shadow:inset 0 0 0 1px var(--accent)}
.rowcheck{display:flex;align-items:center;gap:12px;margin-top:14px;border:0;background:none;font-weight:700;padding:4px 0}
.idea{font:600 20px/1.4 'Bricolage Grotesque',sans-serif;letter-spacing:-.005em;margin:10px 0 4px}
.ideaacts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.ideaacts .btn{flex:1;min-width:130px}

/* Family */
.chal{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;margin-top:10px;border-radius:18px;border:1px solid var(--line);background:var(--field)}
.chal .tag{display:block;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:2px}
.chal .txt{display:block;font-weight:600;line-height:1.4}
.chal.on .txt{opacity:.6;text-decoration:line-through;text-decoration-thickness:1px}

/* Workout */
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 4px}
.chip{border:1px solid var(--line);background:var(--card);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:16px;padding:8px 0;text-align:center;position:relative}
.chip b{display:block;font-size:15px}
.chip small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.on small{color:inherit;opacity:.85}
.chip.today::after{content:"";position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.7}
.restpill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--field);border-radius:999px;padding:3px}
.restpill button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-weight:800;font-size:18px}
.restpill span{font-weight:700;font-size:14px;min-width:62px;text-align:center}
.ex h2{font-size:19px}
.target{color:var(--muted);font-weight:600;font-size:14px}
.setrow{display:grid;grid-template-columns:48px 1fr 1fr 64px;gap:8px;align-items:center;margin-top:10px}
.setn{font-weight:700;font-size:14px;color:var(--muted)}
.fld{position:relative;display:block}
.fld input{padding-right:42px;text-align:center;font-weight:700}
.fld span{position:absolute;right:11px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.donebtn{height:46px;border-radius:14px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-weight:800;display:grid;place-items:center}
.donebtn.on{background:var(--accent);color:var(--on-accent)}
.setrow.done input{opacity:.6}
.toggle{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.toggle:last-child{border-bottom:0}
.toggle b{display:block}.toggle small{display:block;color:var(--muted);font-size:14px}
.stat{display:flex;gap:10px;margin-top:10px}
.stat div{flex:1;padding:12px;border-radius:16px;background:var(--field);border:1px solid var(--line)}
.stat b{display:block;font:800 26px 'Bricolage Grotesque',sans-serif}
.stat small{color:var(--muted);font-weight:600}

/* Food */
.faststate{font:800 34px/1.05 'Bricolage Grotesque',sans-serif;letter-spacing:-.02em;margin-top:2px}
.tl{position:relative;height:16px;border-radius:999px;background:var(--field);border:1px solid var(--line);margin:16px 0 6px;overflow:hidden}
.tl .band{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.85}
.tl .now{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--text);border-radius:2px}
.tlx{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:600}
.meal{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.meal:last-child{border-bottom:0}
.mtxt{font-weight:700;line-height:1.35}
.calbox{position:relative;width:92px;flex:none}
.calbox input{padding-right:30px;text-align:right;font-weight:800}
.calbox span{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted)}
.total{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.total b{font:800 30px 'Bricolage Grotesque',sans-serif}

.composer{display:flex;gap:8px;margin-top:10px;align-items:stretch}
.composer .calbox{width:112px}.composer .btn{flex:1;width:auto}
.rchips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.rchip{flex:none;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-weight:600;font-size:14px}
.rchip b{color:var(--accent);margin-left:4px}
.mealrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 0;border:0;border-bottom:1px solid var(--line);background:none}
.mealrow:last-child{border-bottom:0}
.mline{display:block;margin-top:2px}.msrc{color:var(--accent);font-weight:600}
.mealrow .mtxt{display:block}
.mcal{text-align:right;flex:none}.mcal b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif}.mcal small{color:var(--muted);font-size:12px}
.mealrow>svg{color:var(--muted);flex:none}
.itrow{display:grid;grid-template-columns:1fr 104px 34px;gap:8px;align-items:center;margin-top:10px}
.danger{color:#dc2626}
.perow{display:grid;grid-template-columns:1fr 54px 76px auto;gap:6px;align-items:center;margin-top:8px}
.perow input{padding:10px 9px}
.pehead{margin-top:14px;font-size:12.5px;font-weight:700;color:var(--muted)}
.peb{display:flex;gap:4px}
.peb button{width:34px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--field);font-weight:800}
.peb button[disabled]{opacity:.35}
/* Tabs */
.tabs{position:fixed;z-index:20;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card2);-webkit-backdrop-filter:blur(26px) saturate(1.6);backdrop-filter:blur(26px) saturate(1.6);border-top:1px solid var(--line)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted);border-radius:16px}
.tab.on{color:var(--accent)}
.tab.on svg{background:color-mix(in srgb,var(--accent) 16%,transparent);border-radius:12px}
.tab svg{padding:3px 12px;box-sizing:content-box}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:40;overflow:auto;-webkit-overflow-scrolling:touch;background:color-mix(in srgb,var(--bg0) 72%,transparent);-webkit-backdrop-filter:blur(34px);backdrop-filter:blur(34px);padding:calc(env(safe-area-inset-top,0px) + 8px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.sheet-in{max-width:560px;margin:0 auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 4px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.frow span{font-weight:600}
.frow input,.frow select{max-width:56%}
.fstack{display:block;margin-top:10px}
.fstack span{display:block;font-weight:600;font-size:14px;margin-bottom:6px;color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{border:2px solid transparent;background:none;padding:0;border-radius:18px;text-align:center}
.sw .tile{display:block;height:92px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.sw .tile svg{width:100%;height:100%;display:block}
.sw em{display:block;font-style:normal;font-weight:700;font-size:13px;margin:5px 0 4px}
.sw.on{border-color:var(--accent)}
.seg{display:flex;padding:4px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:9px 0;border-radius:999px;font-weight:700;font-size:15px}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.lockwin{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
details summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary h3{margin:0}
.steps{margin:12px 0 0;padding-left:20px}
.steps li{margin-bottom:10px;line-height:1.45}

/* Rest timer */
.rest{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:color-mix(in srgb,var(--bg0) 55%,rgba(0,0,0,.35));-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);padding:24px}
.rest[hidden]{display:none}
.restcard{width:min(360px,100%);text-align:center;background:var(--card2);border:1px solid var(--line);border-radius:32px;padding:26px 20px 20px;box-shadow:var(--shadow)}
.restring{position:relative;width:200px;height:200px;margin:4px auto 6px}
.restring svg{width:100%;height:100%}
.restnum{position:absolute;inset:0;display:grid;place-items:center;font:800 54px 'Bricolage Grotesque',sans-serif;font-variant-numeric:tabular-nums}
.restbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px}
.restbtns button{padding:13px 0;border-radius:999px;border:1px solid var(--line);background:var(--field);font-weight:800}
.restbtns .skip{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.toast{position:fixed;z-index:70;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--text);color:var(--bg0);padding:12px 18px;border-radius:999px;font-weight:700;font-size:15px;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

<div class="wall" id="wall"></div>
<main id="app"></main>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheet" class="sheet" hidden role="dialog" aria-label="Settings"></div>
<div id="editor" class="sheet" hidden role="dialog" aria-label="Edit meal"></div>
<div id="rest" class="rest" hidden role="dialog" aria-label="Rest timer">
  <div class="restcard">
    <p class="muted" style="font-weight:700">Rest</p>
    <div class="restring">
      <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="86" fill="none" stroke="var(--line)" stroke-width="14"/><circle id="restArc" cx="100" cy="100" r="86" fill="none" stroke="var(--accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="540.35" stroke-dashoffset="0" transform="rotate(-90 100 100)"/></svg>
      <div class="restnum" id="restNum">1:00</div>
    </div>
    <p class="muted" id="restNext"></p>
    <div class="restbtns"><button data-act="rt-minus">−15s</button><button class="skip" data-act="rt-skip">Skip</button><button data-act="rt-plus">+15s</button></div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================

// Workout plan by weekday (0 = Sunday … 6 = Saturday). [exercise, sets, target]
const DEFAULT_PLAN = {
  1:{name:'Back & Biceps', s:'Back', ex:[['Lat pulldown',3,'10'],['Seated cable row',3,'10'],['Single-arm dumbbell row',3,'10 each'],['EZ-bar curl',3,'10'],['Incline dumbbell curl',3,'12']]},
  2:{name:'Chest & Triceps', s:'Chest', ex:[['Dumbbell bench press',3,'10'],['Incline dumbbell press',3,'10'],['Cable fly',3,'12'],['Rope pushdown',3,'12'],['Overhead triceps extension',3,'12']]},
  3:{name:'Quads, Calves & Core', s:'Legs', ex:[['Goblet squat',3,'10'],['Leg press',3,'12'],['Walking lunges',3,'10 each'],['Standing calf raise',3,'15'],['Plank',3,'45 sec']]},
  4:{name:'Shoulders & Arms', s:'Arms', ex:[['Seated dumbbell press',3,'10'],['Lateral raise',3,'12'],['Rear delt fly',3,'12'],['Hammer curl',3,'12'],['Bench dips',3,'12']]},
  5:{name:'Glutes, Hamstrings & Core', s:'Glutes', ex:[['Romanian deadlift',3,'10'],['Hip thrust',3,'10'],['Lying leg curl',3,'12'],['Bulgarian split squat',3,'8 each'],['Hanging knee raise',3,'12']]},
  6:{name:'Saturday walk', s:'Walk', walk:true},

};
let PLAN = DEFAULT_PLAN;
function syncPlan(){PLAN=(S&&S.settings&&S.settings.plan)||DEFAULT_PLAN}

// 30 daily themes, rotating. r = [label, YouVersion code]
const THEMES = [
 {t:'Abiding',a:'John 15:5',r:[['John 15','JHN.15'],['John 16','JHN.16']],
  q:["Count how many times Jesus says abide (or remain) in John 15:1–11. What does He promise those who abide, and what happens to those who don’t?", "Jesus says apart from Him you can do nothing (15:5), yet you do plenty without praying. What kind of nothing does He mean, and what kind of fruit is He after?", "The Father prunes branches that are already bearing fruit (15:2). What does it tell you about God that He cuts back even what is growing?", "If someone studied your last week, where would they say your life actually draws its strength: Christ, achievement, approval, or comfort? Be specific.", "Jesus ties abiding to His words abiding in you (15:7). Which truth from these chapters will you carry through today, and when will you come back to it?"],
  h:['Pause for one minute of prayer before you open your phone at lunch','Text a friend the reference John 15:5 and tell them why it matters to you','Pick one fruit of the Spirit to show at home tonight, and watch for the chance','Ask your wife how you can pray for her today']},
 {t:'Rest',a:'Matthew 11:28–30',r:[['Matthew 11','MAT.11'],['Hebrews 4','HEB.4'],['Psalm 62','PSA.62']],
  q:["In Matthew 11:25–30, who does the Father reveal things to, and who does Jesus invite to come? What connects those two groups?", "A yoke is still a tool for work. Why do you think Jesus offers a yoke as the path to rest instead of removing all work?", "Hebrews 4:15–16 describes Jesus as a high priest who sympathizes with weakness. How does that change how you come to Him when you’re worn out?", "Psalm 62:9–10 warns against trusting in status, schemes, and riches. What false refuge do you run to when you’re tired or stressed?", "Where could you actually stop striving today, and what are you afraid will happen if you do?"],
  h:['Take a 10-minute walk today without your phone and pray as you go','Say no to one thing today that crowds out time with your family','Lie down with your kids at bedtime and simply be with them','Tell God out loud the one burden you are giving Him today']},
 {t:'Courage',a:'Joshua 1:9',r:[['Joshua 1','JOS.1'],['Deuteronomy 31','DEU.31'],['Psalm 27','PSA.27']],
  q:["How many times is Joshua told to be strong and courageous in chapter 1, and what reason is attached each time?", "God ties Joshua’s success to meditating on the Law day and night (1:8), not to military strategy. Why would Scripture be the key to courage for a general?", "In Deuteronomy 31:6–8 God promises not to leave or forsake. How does the rest of Joshua’s story show God keeping that promise?", "Fear often hides behind things that look responsible: caution, busyness, keeping the peace. Where is fear dressed up as wisdom in your life?", "Psalm 27 ends by calling you to wait on the Lord. What act of obedience are you delaying, and what is one courageous step you’ll take this week?"],
  h:['Have the hard conversation you’ve been putting off, with gentleness','Lead your family in a short prayer tonight, even if it feels awkward','Encourage a man in your life who is facing something hard','Tell someone what God has been teaching you']},
 {t:'Serving like Jesus',a:'Mark 10:45',r:[['John 13','JHN.13'],['Philippians 2','PHP.2'],['Mark 10','MRK.10']],
  q:["John 13:1–5 tells you what Jesus knew before He washed feet. List what He knew. How do those facts lead to the towel?", "Peter refuses, then overcorrects (13:6–9). Why is it sometimes harder to let Jesus serve you than to serve Him?", "Philippians 2:6–8 traces Jesus stepping down again and again. What does each step reveal about the heart of God?", "In Mark 10:35–45, James and John wanted the seats of honor. Where do you serve your family while quietly wanting credit or control?", "Jesus came to give His life as a ransom (Mark 10:45). If you served at home the way He did, what would it cost you this week?"],
  h:['Do the dishes or a household task tonight without being asked','Help a coworker with something that isn’t your job','Let someone else go first today: in traffic, in line, or in conversation','Get your oldest to help you serve Mom with a surprise']},
 {t:'Love, defined',a:'1 John 4:19',r:[['1 Corinthians 13','1CO.13'],['1 John 4','1JN.4']],
  q:["Paul lists what love is and is not in 1 Corinthians 13:4–7. Which items are actions, and which are inner attitudes?", "Why does Paul say faith that moves mountains and giving everything away are nothing without love (13:1–3)? What does love add that those lack?", "1 John 4:8–10 defines love by God sending His Son. How does the cross correct your idea of what love is?", "Read 13:4–7 with your name in place of love. Where would your wife say it rings least true right now?", "1 John 4:20 says you can’t love God while refusing to love the people in front of you. Who in your house needs a costly act of love from you today?"],
  h:['Choose patience the next time a child tests you, and pray before you respond','Let go of one past offense with your wife and tell God you’re releasing it','Write a short note telling one of your kids why you love them','Do something kind for someone who can’t repay you']},
 {t:'A husband’s calling',a:'Ephesians 5:25',r:[['Ephesians 5','EPH.5'],['Colossians 3','COL.3'],['1 Peter 3','1PE.3']],
  q:["In Ephesians 5:25–33, what does Christ do for the church, and what is His goal for her? Note each verb.", "Paul grounds marriage in Christ and the church (5:32). How does that make your marriage a picture for the watching world, not just a private relationship?", "Christ loves the church to make her holy and radiant (5:26–27). What does that reveal about how Jesus loves you, flaws and all?", "1 Peter 3:7 warns that how a husband treats his wife can hinder his prayers. Is there anything in how you treat her that God would put His finger on?", "What is one concrete way you’ll lay down your preferences for her good this week, in her season with a newborn?"],
  h:['Ask your wife what’s been hardest for her this week, and just listen','Pray over your wife by name before you leave the house','Take on one of her nightly tasks so she can rest','Tell her one way you see Jesus in her']},
 {t:'Fatherhood',a:'Deuteronomy 6:6–7',r:[['Deuteronomy 6','DEU.6'],['Psalm 127','PSA.127'],['Psalm 128','PSA.128'],['Ephesians 6','EPH.6']],
  q:["In Deuteronomy 6:4–9, what has to be on the parent’s heart before it can be taught to the children? Notice the order.", "Psalm 127:1 says unless the Lord builds the house, the builders labor in vain. How does that challenge a dad who feels responsible for everything?", "God calls Himself Father throughout Scripture. What does the way He fathers you show you about the dad you want to be?", "Ephesians 6:4 warns against provoking your children to anger. When do your kids see the worst of you, and what is usually going on in your heart then?", "Deuteronomy 6:7 names sitting, walking, lying down, and rising. Pick one of those moments this week and plan how you’ll talk about God in it."],
  h:['Pray a blessing over each child at bedtime with your hand on their head','Tell your oldest a story about a time God helped you','Keep your phone away for the first 30 minutes after you get home','Thank God out loud at dinner for each family member by name']},
 {t:'Self-control',a:'1 Corinthians 9:27',r:[['1 Corinthians 9','1CO.9'],['Galatians 5','GAL.5'],['Titus 2','TIT.2']],
  q:["In 1 Corinthians 9:24–27, what does Paul compare himself to, and what does he do with his body? Why?", "Galatians 5:16–25 contrasts the works of the flesh with the fruit of the Spirit. Why does Paul call one works and the other fruit?", "Titus 2:11–12 says the grace of God trains us to say no to ungodliness. How is grace, not guilt, the engine of self-control?", "Your workouts and fasting take real discipline. Where do you have strong self-control for goals you care about but weak self-control in what God cares about?", "Which work of the flesh in Galatians 5:19–21 is closest to home right now, and how will you keep in step with the Spirit today (5:25)?"],
  h:['When a craving hits during your fast, use it as a cue to pray','Keep your phone out of the bedroom tonight','Finish your workout and thank God for the body He gave you','Choose a gentle answer in a tense moment today']},
 {t:'Prayer',a:'Matthew 6:6',r:[['Matthew 6','MAT.6'],['Luke 11','LUK.11']],
  q:["In Matthew 6:5–8, what two wrong ways to pray does Jesus describe, and what does He say the Father already knows?", "If the Father knows what you need before you ask (6:8), why does Jesus still tell you to ask?", "In Luke 11:11–13 Jesus compares God to an earthly father giving good gifts. What does He say the Father most wants to give?", "Compare your actual prayers to the Lord’s Prayer. What do they reveal you value most: God’s name, His kingdom, or your requests?", "Luke 11:5–8 encourages bold persistence. What request have you given up on, and will you bring it back to God every day this week?"],
  h:['Pray the Lord’s Prayer slowly with your family tonight','Set three short prayer pauses today: morning, noon, and before you head home','Ask a friend how you can pray for him, then pray right away','Pray with your wife before bed']},
 {t:'Trust over worry',a:'Philippians 4:6–7',r:[['Matthew 6:19–34','MAT.6.19-34'],['Philippians 4','PHP.4']],
  q:["Jesus talks about treasure (6:19–21) right before worry (6:25–34). How are the two connected?", "Jesus says worry can’t add a single hour to your life (6:27). If worry doesn’t work, why is it so hard to stop?", "Philippians 4:5 says the Lord is near, right before telling you not to be anxious. How does His nearness answer anxiety?", "What you worry about often shows what you treasure. What does your most frequent worry reveal about where your treasure is?", "Philippians 4:8 gives a list of things to think about. Pick one true and good thing about God to think on every time worry rises today."],
  h:['Write down your top worry, pray over it, and throw the paper away','Thank God for three specific provisions before each meal today','Encourage your wife about something she’s worried about','Give generously to someone in need as an act of trust']},
 {t:'Gratitude',a:'1 Thessalonians 5:18',r:[['Psalm 103','PSA.103'],['Luke 17:11–19','LUK.17.11-19'],['1 Thessalonians 5','1TH.5']],
  q:["Psalm 103 tells your soul not to forget His benefits. List the benefits named in verses 2–5.", "All ten lepers were healed, but Jesus tells only the one who returned that his faith made him well (Luke 17:19). What did he receive that the others missed?", "Psalm 103:13–14 says God remembers we are dust. How does His tenderness toward weakness move you to thankfulness?", "Ingratitude often sounds like entitlement or complaining. Where have blessings in your life quietly turned into expectations?", "1 Thessalonians 5:18 says give thanks in all circumstances. Name the hardest circumstance you’re in right now, and write one honest thanksgiving inside it."],
  h:['Tell three people something specific you’re thankful for about them','At dinner, have everyone share one thing they’re thankful for','Send a thank-you text to a mentor or pastor','Thank your wife for something she does that usually goes unseen']},
 {t:'Integrity',a:'Proverbs 10:9',r:[['Psalm 15','PSA.15'],['Proverbs 10','PRO.10'],['Proverbs 11','PRO.11']],
  q:["Psalm 15 describes the one who may dwell with God. Which traits are about speech, which about money, and which about relationships?", "Psalm 15:4 honors the one who keeps his word even when it hurts. Why is integrity so often proven by cost?", "Proverbs 11:1 says false scales are an abomination to the Lord. What does God’s concern with something as ordinary as scales tell you about Him?", "Proverbs 10:9 says crooked ways will be found out. Is there anything you’d be uncomfortable for your wife or pastor to see? Name it before God.", "Where at work, online, or at home will you choose integrity today, even though no one would know otherwise?"],
  h:['Keep a promise today, even a small one, and keep it on time','Confess something hidden to God and, if needed, to a trusted brother','Do your work today as if Jesus were your boss','Tell the truth in a moment where shading it would be easier']},
 {t:'The power of words',a:'Ephesians 4:29',r:[['James 3','JAS.3'],['Proverbs 15','PRO.15'],['Ephesians 4','EPH.4']],
  q:["James 3 pictures the tongue as a bit, a rudder, a fire, poison, and a spring. What does each say about the power of words?", "James 3:9–10 says the same mouth blesses God and curses people made in His image. Why does James treat how you talk to people as a worship issue?", "Ephesians 4:30 warns against grieving the Holy Spirit in the middle of a passage about speech. What does it tell you that the Spirit is affected by your words?", "Jesus said the mouth speaks from what fills the heart (Luke 6:45). When your words are sharp at home, what is usually filling your heart?", "Ephesians 4:29 calls for words that fit the moment and give grace. What does each person in your home need to hear from you today?"],
  h:['Speak only encouraging words at home tonight: no sarcasm, no complaints','Tell your oldest three specific things you’re proud of','Apologize for a harsh word you said recently','Send an encouraging message to someone at church']},
 {t:'Forgiveness',a:'Colossians 3:13',r:[['Matthew 18','MAT.18'],['Colossians 3','COL.3']],
  q:["In Matthew 18:21–35, compare the two debts. A talent was about twenty years of wages; a denarius was one day’s. What is Jesus showing with the difference?", "The master’s anger in 18:32–34 is about a forgiven man refusing to forgive. Why is an unforgiving heart so serious for someone who has been forgiven?", "Colossians 3:13 says forgive as the Lord forgave you. How did He forgive you: how fully, how often, at what cost?", "Forgiveness isn’t pretending it didn’t hurt. Is there a hurt you keep replaying? What are you still trying to collect from that person?", "Colossians 3:12–14 says to put on compassion, humility, patience, and love. Toward whom will you deliberately put these on today?"],
  h:['Ask forgiveness from your wife or a child for something specific','Pray for someone who hurt you, by name','When your oldest disobeys today, show forgiveness after the correction','Release a grudge by telling God you’re letting it go']},
 {t:'Humility',a:'James 4:10',r:[['James 4','JAS.4'],['Luke 18:9–14','LUK.18.9-14'],['1 Peter 5','1PE.5']],
  q:["In Luke 18:9–14, notice who each man talks about in his prayer. What does that reveal?", "James 4:1–6 traces fights and quarrels back to desires at war within you. How does pride sit underneath conflict?", "James 4:6 says God gives more grace to the humble. Why would God resist the proud and pour grace on the humble?", "Pride can look like defensiveness, needing to be right, or never asking for help. Which form shows up in you most?", "1 Peter 5:5 says to clothe yourself with humility toward one another. Who do you need to humble yourself toward this week, and how?"],
  h:['Ask your wife for honest feedback on how you’re doing as a husband, and thank her for it','Give someone else credit for a win today','Do a hidden act of service no one will ever know about','Admit a mistake quickly today']},
 {t:'Who you are in Christ',a:'Ephesians 2:10',r:[['Ephesians 1','EPH.1'],['Ephesians 2','EPH.2']],
  q:["List everything Ephesians 1:3–14 says God has done for you in Christ. How many did you find?", "Ephesians 2:1–3 describes who you were before Christ. Why does Paul make you remember that before telling you who you are now?", "Ephesians 2:4 is the turning point of the chapter. What does that turn reveal about God’s character?", "Where are you still trying to earn what Ephesians 1 says you’ve already been given? How does it show up in your work, fitness, or parenting?", "You were created for good works God prepared beforehand (2:10). Ask Him to show you one of today’s prepared works, and watch for it."],
  h:['Tell each of your kids, “I love you no matter what you do”','Write one truth from Ephesians 1 on a card and keep it where you’ll see it','Do one good work today simply because God prepared it for you','Tell your wife who she is in Christ']},
 {t:'Faithful in little',a:'Luke 16:10',r:[['Luke 16:1–13','LUK.16.1-13'],['Matthew 25:14–30','MAT.25.14-30']],
  q:["In the parable of the talents, what did the master say to the faithful servants, and how did he describe the one who buried his talent?", "Luke 16:11 asks who will trust you with true riches if you aren’t faithful with money. What are the true riches Jesus means?", "The master entrusts his property and then leaves (Matthew 25:14–15). What does it say about God that He trusts ordinary people with His things?", "The fearful servant had a wrong view of his master (25:24). Does any fear or wrong view of God keep you from investing what He’s given you?", "Jesus says you can’t serve God and money (Luke 16:13). What small daily act of faithfulness with time, money, or attention will you practice this week?"],
  h:['Finish a small task you’ve been putting off','Fix something at home you said you would fix','Give your kids your full attention for 20 minutes','Give toward your church as an act of faithfulness']},
 {t:'Joy',a:'Nehemiah 8:10',r:[['Nehemiah 8','NEH.8'],['Psalm 16','PSA.16'],['Psalm 100','PSA.100']],
  q:["In Nehemiah 8 the people weep when they hear the Law, but they’re told to celebrate instead. Why were they weeping, and why the call to celebrate?", "Nehemiah 8:10 says the joy of the Lord is your strength. Is that joy He gives, joy you have in Him, or both? Why does it matter?", "Psalm 16:11 says fullness of joy is found in God’s presence. What does it say about Him that real joy is found in Him, not just His gifts?", "If your joy rises and falls with your circumstances, what does that show about where it’s rooted?", "Psalm 16:8 speaks of setting the Lord always before you. What practice will help you do that today, at work and at home?"],
  h:['Have a dance party with your kids tonight','Play worship music in the car and sing out','Laugh with your wife about a favorite memory','Tell someone what God has done for you this year']},
 {t:'Generosity',a:'2 Corinthians 9:7',r:[['2 Corinthians 8','2CO.8'],['2 Corinthians 9','2CO.9']],
  q:["2 Corinthians 8:1–5 describes the Macedonian churches. List what they had and what they did. What did they give first (8:5)?", "Paul says he isn’t commanding them (8:8). Why does generosity have to come from the heart rather than pressure?", "2 Corinthians 9:8–11 says God is able to make all grace abound. What does this passage say about God as the first and greatest giver?", "What do your giving and spending show you love most? Is there fear or control in how you hold your money?", "2 Corinthians 9:7 says each should give as he has decided in his heart. What will you decide before God about your giving this month?"],
  h:['Buy coffee or lunch for someone today','Let your oldest help you give to someone in need','Give your wife an evening off','Pray about your giving to the church this month']},
 {t:'Purity',a:'Psalm 119:9',r:[['Psalm 119:1–48','PSA.119.1-48'],['1 Thessalonians 4','1TH.4']],
  q:["Psalm 119:9–16 lists what the psalmist does with God’s Word. Make a list of the verbs.", "1 Thessalonians 4:3–8 says God’s will is your sanctification. Why does Paul say rejecting this is rejecting God Himself, not just a rule (4:8)?", "God calls His people to be holy because He is holy. What does His call to purity show about His love for you and your marriage?", "Purity starts in the heart before the eyes. What need are you trying to meet when temptation pulls at you: comfort, escape, or significance?", "Psalm 119:11 talks about storing God’s Word in your heart. What guardrail will you set up today, and which verse will you memorize to fight with?"],
  h:['Delete or block one app or account that pulls you toward compromise','Memorize Psalm 119:9 today','Text an accountability partner to check in','Thank God for your wife and pray for your marriage']},
 {t:'Telling others',a:'Acts 1:8',r:[['Acts 1','ACT.1'],['Acts 2','ACT.2']],
  q:["In Acts 1:8, what does Jesus promise first, and then what? In what order does the witness spread?", "Before Pentecost the disciples were told to wait (1:4). Why did they need the Spirit’s power before they could witness?", "In Acts 2:22–36, what does Peter say God did through Jesus? What does that reveal about God’s plan?", "If you rarely talk about Jesus, what’s the real reason: fear of rejection, not knowing what to say, or not feeling the urgency?", "Acts 2:46–47 describes open homes and people added daily. Who is one person you’ll pray for and move toward this week?"],
  h:['Pray for three people by name who need Jesus','Invite someone to church this Sunday','Tell someone your story of meeting Jesus','Invite a neighbor family over']},
 {t:'Perseverance',a:'Hebrews 12:1–2',r:[['Hebrews 12','HEB.12'],['James 1','JAS.1']],
  q:["Hebrews 12:1 comes right after Hebrews 11’s list of faithful people. Who is the great cloud of witnesses, and how should they affect your race?", "Hebrews 12:5–11 calls hardship discipline. How is God’s discipline different from punishment?", "Hebrews 12:2 calls Jesus the founder and perfecter of our faith. How does looking at His endurance give you endurance?", "James 1:13–15 traces temptation to your own desires. When you want to quit, what desire is pulling you?", "James 1:5 promises wisdom to anyone who asks. Where do you need wisdom to keep going? Ask for it right now."],
  h:['Push through your workout and pray during the hardest set','Encourage someone who is running a hard race right now','Keep going on a commitment you’ve wanted to drop','Fix your eyes on Jesus: pause three times today to pray']},
 {t:'God’s Word',a:'2 Timothy 3:16–17',r:[['Psalm 1','PSA.1'],['Psalm 19','PSA.19'],['2 Timothy 3','2TI.3']],
  q:["Psalm 19 has two halves: God revealed in creation (19:1–6) and in His Word (19:7–11). What does each half show you?", "2 Timothy 3:16–17 lists four things Scripture is useful for. What’s the difference between teaching, rebuking, correcting, and training?", "God has spoken and hasn’t left us guessing. What does that tell you about His desire to be known?", "Psalm 1:2 describes delighting in God’s law. Honestly, is Bible reading a delight or a duty for you right now? What might change that?", "Psalm 19:14 is a prayer about your words and thoughts. Pray it, then pick one verse from today to meditate on all day."],
  h:['Read a short passage to your kids at dinner','Memorize one verse this week as a family','Text a verse reference to your wife with a note on why','Share something from your reading with a friend']},
 {t:'Contentment',a:'Hebrews 13:5',r:[['1 Timothy 6','1TI.6'],['Hebrews 13','HEB.13']],
  q:["In 1 Timothy 6:6–10, what does Paul say we brought into the world and can take out? Where does he say the desire to be rich leads?", "Paul says godliness with contentment is great gain. Why pair godliness with contentment?", "Hebrews 13:5 grounds contentment in God’s promise never to leave you. How is His presence the real answer to wanting more?", "Finish this honestly: If I just had ___, I’d be satisfied. What does your answer show about your heart?", "1 Timothy 6:17–19 calls the rich to be rich in good works. What would being rich in good works look like for you this week?"],
  h:['Go a day without buying anything nonessential','Walk through your home and thank God room by room','Unfollow an account that feeds discontent','Tell your wife you’re content with her and your life together']},
 {t:'Patience',a:'Psalm 37:7',r:[['Psalm 37','PSA.37'],['James 5','JAS.5']],
  q:["Psalm 37:1–9 gives a chain of commands: don’t fret, trust, delight, commit, be still, wait. What does the order teach you?", "James 5:7–11 points to the farmer, the prophets, and Job. What do the three have in common?", "James 5:11 says the Lord is compassionate and merciful. How does God’s patience with you shape your patience with others?", "Impatience often reveals what you think you deserve. What does your impatience with your kids or your wife show about your expectations?", "Psalm 37:7 calls you to be still before the Lord. Where will you build a moment of stillness into today?"],
  h:['Take three slow breaths and pray before responding when frustrated','Let your oldest do something slowly on their own without rushing them','Wait until your wife has completely finished talking before you speak','Drive the speed limit today and pray for the drivers around you']},
 {t:'United',a:'Romans 12:10',r:[['John 17','JHN.17'],['Psalm 133','PSA.133'],['Romans 12','ROM.12']],
  q:["In John 17:20–23, who does Jesus pray for, and what does He say their unity will show the world?", "Romans 12:3–8 talks about gifts in one body. Why does Paul warn against thinking too highly of yourself before he talks about gifts?", "John 17:21 roots our unity in the unity of the Father and the Son. What does that reveal about the God you worship?", "Where are you feeding division in your marriage, family, or church, even quietly, through criticism, withdrawal, or keeping score?", "Romans 12:9–21 is full of practical commands. Choose one to practice toward your wife this week and one toward your church family."],

  const P=L.day===todayKey()?L.prev:L;if(!P)return{w:'',r:'',sets:L.sets||defSets,up:0,last:null};
  const pw=parseFloat(P.w);const up=(P.hit&&pw>0)?(pw<30?2.5:5):0;
  return{w:pw>0?String(pw+up):(P.w||''),r:P.r||'',sets:P.sets||defSets,up,last:P}}
function setsFor(d,pd,i){const ex=PLAN[pd].ex[i];return d.wo.n?.[`${pd}:${i}`]??liftPlan(ex[0],ex[1]).sets}
function setCount(d,pd){const P=PLAN[pd];if(!P.ex)return[0,0];let t=0,n=0;P.ex.forEach((e,i)=>{const c=setsFor(d,pd,i);for(let j=0;j<c;j++){t++;if(d.wo.sets[`${pd}:${i}-${j}`]?.done)n++}});return[n,t]}
function saveLift(d,pd,i){const[name,,target]=PLAN[pd].ex[i];const tn=parseInt(target)||0;const c=setsFor(d,pd,i);const tk=todayKey();
  const ss=[];for(let j=0;j<c;j++)ss.push(d.wo.sets[`${pd}:${i}-${j}`]||{});const done=ss.filter(x=>x.done);if(!done.length)return;
  const top=ss[0].done?ss[0]:done[0];const L=S.lifts[name];
  const prev=L?(L.day===tk?L.prev:{w:L.w,r:L.r,sets:L.sets,hit:L.hit,day:L.day}):null;
  S.lifts[name]={w:top.w||'',r:top.r||'',sets:c,hit:done.length===c&&done.every(x=>(parseFloat(x.r)||0)>=tn),day:tk,prev};markProf()}

function lockState(){
  const m=nowMin();let best=null;
  for(const w of S.settings.lock){const s=toMin(w.s),e=toMin(w.e);const inW=s<e?(m>=s&&m<e):(m>=s||m<e);
    if(inW)return{on:true,w,left:(e-m+1440)%1440,night:s>e||s>=21*60};
    const until=(s-m+1440)%1440;if(!best||until<best.until)best={w,until}}
  return{on:false,next:best};
}
function fastState(){const s=toMin(S.settings.fastStart),e=toMin(S.settings.fastEnd),m=nowMin();const open=s<e?(m>=s&&m<e):(m>=s||m<e);return{open,left:((open?e:s)-m+1440)%1440}}

function famPicks(d){const n=dn(),sd=d.fam.seed;return[
  {k:'b'+((n+sd)%KIDS_BIG.length),who:cap(BIG()),t:KIDS_BIG[(n+sd)%KIDS_BIG.length]},
  {k:'y'+((n*3+sd)%KIDS_BABY.length),who:cap(BABY()),t:KIDS_BABY[(n*3+sd)%KIDS_BABY.length]},
  {k:'a'+((n*7+sd)%KIDS_ALL.length),who:'Everyone',t:KIDS_ALL[(n*7+sd)%KIDS_ALL.length]}]}
function wifeIdea(d){return d.wife.fresh||WIFE[(dn()+d.wife.off)%WIFE.length]}
function calTotal(d){return d.meals.reduce((a,m)=>a+(Number(m.cal)||0),0)}
function inWindow(ts){const dt=new Date(ts),m=dt.getHours()*60+dt.getMinutes(),s=toMin(S.settings.fastStart),e=toMin(S.settings.fastEnd);return s<e?(m>=s&&m<e):(m>=s||m<e)}
function flags(d,k){const wo=workoutMet(d,k),fam=d.wife.done||d.fam.done.length>0,water=d.water>=(S.settings.water||120),food=water&&d.meals.every(m=>inWindow(m.at));
  return {qt:!!d.qt.done,wo,wf:!!d.wife.done,fam,food,all:!!(d.qt.done&&wo&&d.wife.done&&d.fam.done.length>0&&water)}}
function streak(f='all'){let n=0;const tk=todayKey(),live=flags(day(),tk);const dt=new Date();if(!live[f])dt.setDate(dt.getDate()-1);
  for(let i=0;i<400;i++){const k=keyOf(dt);const ok=k===tk?live[f]:S.hist[k]?.[f];if(!ok)break;n++;dt.setDate(dt.getDate()-1)}return n}
const STREAK_FOR={home:['all','Everything done'],quiet:['qt','Quiet time'],workout:['wo','Workout'],family:['fam','Family'],food:['food','Water and fasting']};
function appbar(){const [f,l]=STREAK_FOR[tab];const n=streak(f);return `<div class="appbar"><span class="mark">${LOGO}</span><span class="pill" role="img" aria-label="${l} streak: ${n} day${n===1?'':'s'}">⚡ ${n}</span></div>`}

function isDark(){const m=S.settings.mode;return m==='dark'||(m==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)}
function wallSVG(p,style,id){

  return `<svg ${V}><defs><linearGradient id="${id}a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${w1}"/><stop offset="1" stop-color="${w3}"/></linearGradient><linearGradient id="${id}c" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${w2}"/><stop offset="1" stop-color="${w1}"/></linearGradient><linearGradient id="${id}e" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="${w3}"/><stop offset="1" stop-color="${w2}"/></linearGradient></defs><rect width="400" height="860" fill="${w0}"/><path d="M0 250C110 170 250 330 400 230V860H0Z" fill="url(#${id}a)" opacity=".5"/><path d="M0 470C150 380 240 560 400 450V860H0Z" fill="url(#${id}c)" opacity=".68"/><path d="M0 680C120 610 290 740 400 650V860H0Z" fill="url(#${id}e)" opacity=".85"/></svg>`;

/* ---------- toast, sound ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2800)}
let actx=null;function prime(){try{if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(A)actx=new A()}if(actx&&actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(actx){[0,.22].forEach(off=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+off;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.start(t);o.stop(t+.2)})}}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}

let RT=null,rtInt=null;const RC=540.35;
function startRest(label){const sec=S.settings.rest;RT={end:Date.now()+sec*1000,total:sec};$('#restNext').textContent=label||'';$('#rest').hidden=false;rtTick();clearInterval(rtInt);rtInt=setInterval(rtTick,250)}
function rtTick(){if(!RT)return;const left=Math.max(0,(RT.end-Date.now())/1000);if(left>RT.total)RT.total=left;
  $('#restNum').textContent=mmss(Math.ceil(left));$('#restArc').setAttribute('stroke-dashoffset',RC*(1-left/RT.total));
  if(left<=0){clearInterval(rtInt);RT=null;$('#restNum').textContent='Go';beep();setTimeout(()=>{if(!RT)$('#rest').hidden=true},1300)}}

function applyLocal(m){let r;try{r=estimateLocal(m.text)}catch(e){r={items:[],note:''}}m.items=r.items.length?r.items:[{name:m.text,cal:null}];m.cal=mealCal(m);m.src='local';m.note=r.note||''}
function addMeal(){
  const ta=$('#mealText'),ce=$('#mealCal');
  const text=String((ta&&ta.value)||mealDraft||'').trim();
  const rawCal=ce&&ce.value!==''?ce.value:mealCalDraft;const manual=rawCal!==''&&rawCal!=null&&!isNaN(+rawCal)?Math.max(0,Math.round(+rawCal)):null;
  if(!text&&manual==null){toast('Type what you ate first.');if(ta)ta.focus();return}
  if(ta)ta.blur();if(ce)ce.blur();
  const d=day();const m={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:text||'Meal',at:Date.now(),items:[],cal:null,src:'local'};
  if(manual!=null){m.items=[{name:text||'Meal',cal:manual}];m.cal=manual;m.src='manual'}else applyLocal(m);
  d.meals.unshift(m);mealDraft='';mealCalDraft='';markDay();render();

async function claudeEstimate(m){
  if(!sampleFn||m.pending)return;m.pending=true;render();const mark=m.editedAt||0;
  const prompt=`Estimate calories for this meal log entry. If a restaurant or chain is named, use its published nutrition information as best you know it; otherwise use typical USDA values and common US portions unless sizes are given. List each food separately.
Meal: [${m.text}]
Reply with only JSON and nothing else: {"items":[{"name":"short item name with size or count","calories":0}],"note":"one short assumption, under 12 words"}`;
  const ctl=new AbortController();const timer=setTimeout(()=>ctl.abort(),45000);
  try{const res=await sampleFn(prompt,{modelTier:'quick',signal:ctl.signal});
    const raw=String(res&&res.text||'');const a=raw.indexOf('{'),z=raw.lastIndexOf('}');if(a<0||z<=a)throw {code:'bad_json'};
    const r=JSON.parse(raw.slice(a,z+1));const items=Array.isArray(r.items)?r.items.slice(0,15).map(x=>({name:cap(String(x.name||'Item').slice(0,60)),cal:Math.max(0,Math.round(Number(x.calories)||0))})).filter(x=>x.name):[];
    if(items.length&&(m.editedAt||0)===mark){m.items=items;m.cal=mealCal(m);m.src='claude';m.note=String(r.note||'').slice(0,120)}
  }catch(e){if(e&&e.code==='not_granted')sampleFn=null}
  finally{clearTimeout(timer)}
  m.pending=false;markDay();render();
}
async function freshIdea(){
  const d=day();if(!sampleFn)return;wifeBusy=true;render();
  const prompt=`Give one fresh, specific, free way a Christian husband can encourage and love his wife today. They have a child who is almost 5 and an 11-week-old baby, so she may be tired and still recovering after birth. It should challenge him in a godly, selfless way, be doable today, and cost nothing. Do not repeat this idea: "${wifeIdea(d)}". Reply with 1–2 plain sentences addressed to him as "you". No intro, no quotes.`;
  try{const r=await sampleFn(prompt,{modelTier:'quick',cache:false});const t=String(r.text||'').trim().replace(/^["“]+|["”]+$/g,'');if(t){d.wife.fresh=t.slice(0,400);markDay()}}
  catch(e){if(e&&e.code==='not_granted'){sampleFn=null;toast('Permission to use Claude was declined.')}else toast('Couldn’t get a new idea right now.')}
  wifeBusy=false;render();
}

    case 'me-iadd':{const m=d.meals.find(x=>x.id===editId);if(!m)break;m.items.push({name:'',cal:null});m.editedAt=Date.now();m.src='manual';markDay();render();const ins=document.querySelectorAll('#editor [data-me="iname"]');if(ins.length)ins[ins.length-1].focus();break}
    case 'me-idel':{const m=d.meals.find(x=>x.id===editId);if(!m)break;m.items.splice(+v,1);if(!m.items.length)m.items=[{name:m.text,cal:null}];m.cal=mealCal(m);m.editedAt=Date.now();m.src='manual';markDay();render();break}
    case 'me-del':{if(!delArmed){delArmed=true;$('#editor').innerHTML=viewMealEdit();break}d.meals=d.meals.filter(x=>x.id!==editId);delArmed=false;editId=null;$('#editor').hidden=true;markDay();render();toast('Meal deleted.');break}
    case 'meal-again':{const[k,id]=v.split('|');const src=((S.days[k]||{}).meals||[]).find(x=>x.id===id);if(!src)break;
      const m={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:src.text,at:Date.now(),items:JSON.parse(JSON.stringify(src.items||[])),src:src.src==='claude'?'claude':src.src,note:''};m.cal=mealCal(m);
      d.meals.unshift(m);markDay();render();toast(`Logged again. ${m.cal} calories.`);break}
    case 'pe-day':planDay=+v;$('#sheet').innerHTML=viewSettings();break;
    case 'pe-type':{const p=planCopy(),pd=p[planDay];
      if(v==='lift'){delete pd.walk;delete pd.rest;if(!pd.ex||!pd.ex.length)pd.ex=[['New exercise',3,'10']];if(/walk|rest/i.test(pd.name))pd.name='Workout';pd.s=shortName(pd.name)}
      else if(v==='walk'){pd.walk=true;delete pd.rest;pd.s='Walk';if(!/walk/i.test(pd.name))pd.name='Walk'}
      else{pd.rest=true;delete pd.walk;pd.s='Rest';if(!/rest/i.test(pd.name))pd.name='Rest day'}
      markProf();syncPlan();$('#sheet').innerHTML=viewSettings();break}
    case 'pe-add':{const p=planCopy();p[planDay].ex=p[planDay].ex||[];p[planDay].ex.push(['New exercise',3,'10']);markProf();syncPlan();$('#sheet').innerHTML=viewSettings();const ins=document.querySelectorAll('#sheet [data-plan="ex-name"]');const last=ins[ins.length-1];if(last){last.focus();last.select()}break}
    case 'pe-up':{const i=+v;if(i<1)break;const p=planCopy(),ex=p[planDay].ex;[ex[i-1],ex[i]]=[ex[i],ex[i-1]];markProf();syncPlan();$('#sheet').innerHTML=viewSettings();break}
    case 'pe-del':{const p=planCopy(),ex=p[planDay].ex;if(ex.length<=1){toast('Keep at least one exercise, or make it a walk or rest day.');break}ex.splice(+v,1);markProf();syncPlan();$('#sheet').innerHTML=viewSettings();break}
    case 'pe-reset':{if(!planResetArmed){planResetArmed=true;$('#sheet').innerHTML=viewSettings();break}S.settings.plan=null;planResetArmed=false;markProf();syncPlan();$('#sheet').innerHTML=viewSettings();toast('Starter plan restored.');break}
    case 'reset-day':if(!resetArmed){resetArmed=true;$('#sheet').innerHTML=viewSettings();break}S.days[todayKey()]=blankDay();resetArmed=false;markDay();render();toast('Today cleared.');break;
  }}catch(err){console.error(err);toast('Something went wrong: '+((err&&err.message)||err))}
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.me){const m=day().meals.find(x=>x.id===editId);if(!m)return;const me=el.dataset.me;
    if(me==='text')m.text=el.value;
    else if(me==='iname'){if(m.items[+el.dataset.i])m.items[+el.dataset.i].name=el.value;m.src='manual'}
    else if(me==='ical'){if(m.items[+el.dataset.i])m.items[+el.dataset.i].cal=el.value===''||isNaN(+el.value)?null:Math.max(0,Math.round(+el.value));m.cal=mealCal(m);m.src='manual';const tt=$('#meTotal');if(tt)tt.textContent=m.cal??'—'}
    if(me!=='time'){m.editedAt=Date.now();markDay()}return}
  if(el.dataset.plan){const p=planCopy(),pd=p[planDay],i=+el.dataset.i,k=el.dataset.plan;
    if(k==='name'){pd.name=el.value.slice(0,40);if(!pd.walk&&!pd.rest)pd.s=shortName(pd.name)}
    else if(k==='ex-name'&&pd.ex[i])pd.ex[i][0]=el.value.slice(0,50);
    else if(k==='ex-sets'&&pd.ex[i]){const n=Math.round(+el.value);if(n>=1&&n<=10)pd.ex[i][1]=n}
    else if(k==='ex-target'&&pd.ex[i])pd.ex[i][2]=el.value.slice(0,16);
    markProf();syncPlan();return}
  const t=el.dataset.in;if(!t)return;const d=day();
  if(t==='mealcalnew'){mealCalDraft=el.value;return}

  if(t==='ans'){d.qt.ans[el.dataset.i]=el.value;markDay()}
  else if(t==='w'||t==='r'){const st=d.wo.sets[el.dataset.k]||(d.wo.sets[el.dataset.k]={});st[t]=el.value;
    const j=+el.dataset.j,ex=el.dataset.ex;
    if(j===0){document.querySelectorAll(`[data-in="${t}"][data-ex="${ex}"]`).forEach(inp=>{const jj=+inp.dataset.j;if(jj===0)return;const s2=d.wo.sets[inp.dataset.k]||(d.wo.sets[inp.dataset.k]={});if(s2.done||s2['t'+t])return;s2[t]=el.value;inp.value=el.value})}
    else st['t'+t]=true;
    markDay()}
  else if(t==='water'){d.water=+el.value;el.style.setProperty('--p',(el.value/el.max*100)+'%');const n=$('#waterNum');if(n)n.firstChild.nodeValue=d.water;markDay()}
  else if(t==='meal'){mealDraft=el.value}
  else if(t==='mealcal'){const m=d.meals.find(x=>x.id===el.dataset.id);if(m){m.cal=el.value===''?null:Math.round(+el.value);markDay();const c=$('#calTotal');if(c)c.textContent=calTotal(d)}}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.me==='time'&&el.value){const d=day(),m=d.meals.find(x=>x.id===editId);if(m){const[h,mi]=el.value.split(':').map(Number);const dt=new Date(m.at);dt.setHours(h,mi,0,0);m.at=dt.getTime();d.meals.sort((x,y)=>y.at-x.at);markDay();render()}return}
  if(el.dataset.plan){const p=planCopy(),pd=p[planDay],i=+el.dataset.i,k=el.dataset.plan;
    if(k==='ex-name'&&pd.ex[i]&&!pd.ex[i][0].trim())pd.ex[i][0]='Exercise';
    if(k==='ex-target'&&pd.ex[i]&&!String(pd.ex[i][2]).trim())pd.ex[i][2]='10';
    if(k==='ex-sets'&&pd.ex[i]){pd.ex[i][1]=Math.min(10,Math.max(1,Math.round(+el.value)||3));el.value=pd.ex[i][1]}
    if(k==='name'&&!pd.name.trim()){pd.name='Workout';pd.s='Lift'}
    markProf();syncPlan();return}

  if(el.dataset.set){const k=el.dataset.set;let v=el.value;
    if(k==='rest')v=Math.min(300,Math.max(15,Math.round(+v||60)));
    else if(k==='water')v=Math.max(8,Math.round(+v||120));
    else if(k==='cal')v=Math.max(0,Math.round(+v||0));
    else if((k==='fastStart'||k==='fastEnd')&&!v)return;
    else if(typeof v==='string')v=v.trim().slice(0,40);
    S.settings[k]=v;markProf();applyTheme();render()}
  if(el.dataset.lock&&el.value){const[i,p]=el.dataset.lock.split('-');S.settings.lock[+i][p]=el.value;markProf();render()}
  if(el.dataset.in==='water'&&tab==='home')render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#rest').hidden)stopRest();else if(!$('#editor').hidden){$('#editor').hidden=true;editId=null;render()}else if(!$('#sheet').hidden){$('#sheet').hidden=true;render()}}});

/* ---------- clock ---------- */
let curKey=todayKey(),tick=0;
setInterval(()=>{
  const k=todayKey();if(k!==curKey){curKey=k;if(!isTyping())render();return}
  if(tab==='quiet'){const d=day(),s=qtSecs(d),c=$('#qtClock');if(c){c.textContent=mmss(s);$('#qtBar').style.width=Math.min(100,s/9)+'%';if(s>=900)$('#qtOf').textContent='15 minutes reached'}
    if(d.qt.run&&s>=900&&!d.qt.hit){d.qt.hit=true;markDay();beep();toast('15 minutes. Keep going or finish up.')}}
  if(++tick%30===0&&(tab==='home'||tab==='food'||tab==='family')&&!isTyping()&&$('#sheet').hidden)render();
},1000);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{applyTheme();render()});

window.addEventListener('error',e=>{try{toast('Something went wrong: '+(e.message||'unknown error'))}catch(_){}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
/* ---------- start ---------- */
loadLocal();migrate();applyTheme();render();initCloud();if(dirtyProf)schedule();
</script>
